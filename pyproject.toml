[project]
name = "changes-metadata-manager"
version = "1.0.0"
description = "Map RDF knowledge graph triples to Aldrovandi digitization folder stages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "piccione>=3.1.2",
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
    "rich>=14.2.0",
]

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "jupyter-book~=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-freezer>=0.4.9",
    "reuse>=6.2.0",
    "ruff>=0.15.20",
    "watchdog[watchmedo]>=6.0.0",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
commit_message = "chore(release): {version}"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
