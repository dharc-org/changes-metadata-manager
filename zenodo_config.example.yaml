notes: |
  This dataset is part of the CHANGES project (Cultural Heritage Active Innovation for Next-Gen Sustainable Society), Spoke 4, funded by the European Union - NextGenerationEU under the National Recovery and Resilience Plan (PNRR), Mission 4 Component 2 Investment 1.3 (Project PE 0000020 - CUP B53C22003780006).

  The Aldrovandi Digital Twin documents the temporary exhibition "The Other Renaissance: Ulisse Aldrovandi and the Wonders of the World" held at Palazzo Poggi Museum, Bologna (December 2022 - May 2023).

method: |
  Acquisition and digitization followed the reproducible workflow documented in https://doi.org/10.46298/transformations.14773.

  Data was acquired using:
  - Structured Light Scanning (Artec Space Spider, Artec Eva)
  - Digital Photogrammetry (Structure from Motion / Multi-View Stereo)

  Processing stages:
  - Raw sensor data: original acquisition output (photos/scans)
  - Processed raw model (RAWp): preliminary output after initial processing
  - Digital Cultural Heritage Object (DCHO): refined model with geometry corrections
  - Optimized DCHO (DCHOo): web-ready version for real-time interaction

  Metadata follows the Cultural Heritage Acquisition and Digitisation Application Profile (CHAD-AP) based on CIDOC-CRM.

