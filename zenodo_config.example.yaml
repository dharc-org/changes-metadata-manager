notes: |
  This dataset is part of the CHANGES project (Cultural Heritage Active Innovation for Next-Gen Sustainable Society), Spoke 4, funded by the European Union - NextGenerationEU under the National Recovery and Resilience Plan (PNRR), Mission 4 Component 2 Investment 1.3 (Project PE 0000020 - CUP B53C22003780006).

  The Aldrovandi Digital Twin documents the temporary exhibition "The Other Renaissance: Ulisse Aldrovandi and the Wonders of the World" held at Palazzo Poggi Museum, Bologna (December 2022 - May 2023).

method: |
  Data was acquired using:
  - Structured Light Scanning (Artec Space Spider, Artec Eva)
  - Digital Photogrammetry (SfM/MVS)

  Processing stages:
  - RAW: Raw sensor data
  - RAWp: Processed raw model
  - DCHO: Digital Cultural Heritage Object (geometry corrections)
  - DCHOo: Optimized DCHO (web-ready)

  Metadata follows CHAD-AP ontology based on CIDOC-CRM.

